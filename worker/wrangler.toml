name = "yancocup-api"
main = "src/index.ts"
compatibility_date = "2025-04-01"

# KV namespace for cached scores
[[kv_namespaces]]
binding = "SCORES_KV"
id = "c28d05b0f84a402aa441c0473de4a35a"

# Cron Triggers — poll live scores
# Every 60s for World Cup 2026 live coverage. Revert to */5 after the final
# (2026-07-19) to save API budget in the off-season.
#
# handleCron's periodic gates are wall-clock-anchored (epoch minutes % 25/50/
# 75/120/150), so changing the cron cadence does NOT change their frequency —
# only the every-run score poll speeds up. Gate periods must stay multiples
# of the cron interval, so don't go coarser than */5.
#
# KV write budget at 60s (free tier: 1,000/day): every-run writes are all
# skip-if-unchanged (scores, status map, all:live) and the rate limiter is
# in-memory, so steady-state writes come from actual score/status changes
# plus short-TTL detail caches — roughly 300-600/day on a busy match day.
[triggers]
crons = ["* * * * *"]

# Workers AI binding for news article rewriting
[ai]
binding = "AI"

# Secrets (set via `wrangler secret put`):
# FOOTBALL_DATA_API_KEY — football-data.org API key
# API_FOOTBALL_KEY — API-Football (api-sports.io) key
# ADMIN_KEY — admin endpoint authentication secret
# SUPABASE_URL — Supabase project URL
# SUPABASE_SERVICE_KEY — Supabase service role key (for article inserts)
