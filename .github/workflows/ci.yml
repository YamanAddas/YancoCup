name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: TypeScript
        run: npx tsc --noEmit
      - name: Tests
        run: npm test
      - name: Build
        # VITE_ values are public by project policy (they ship verbatim in the
        # deployed bundle): Supabase anon key, public VAPID key, Sentry DSN.
        # Without them the Supabase client throws at module init and the SPA
        # renders a blank page — never deploy a build made without them.
        env:
          VITE_SUPABASE_URL: https://vxmopqjpqqdlkfceufru.supabase.co
          VITE_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZ4bW9wcWpwcXFkbGtmY2V1ZnJ1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzExMDIyMTYsImV4cCI6MjA4NjY3ODIxNn0.khv4ie12t3G4uKxSKcDK8px0HU5nuLPsF_nj-J93b_k
          VITE_ADMIN_USER_ID: cd237d4b-864a-463c-84ba-13bd2ddfc848,bc38b467-fbf4-46dd-89fd-e418a9aa8761
          VITE_SENTRY_DSN: https://e276d63da88ab4399bedb4767fc46583@o4509416043118592.ingest.us.sentry.io/4511192663851008
          VITE_VAPID_PUBLIC_KEY: BKgbZQF_VOy66CFeBVSfMdSP0Zt7xkdCn2TdJ-fivKZjnuIgmqu_wfzqzA23cVLltMQPYpKqBXCR0wwhK6huw3s
        run: npx vite build --base=/YancoCup/
      - name: Upload build for deploy
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist

  # The site once drifted 38 days behind main because deploys were manual —
  # every push to main now ships automatically.
  deploy-frontend:
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: Publish to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist

  # Requires the CLOUDFLARE_API_TOKEN repo secret (Workers edit scope).
  # Until it's added, this job is skipped rather than failing the run.
  deploy-worker:
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Skip if no Cloudflare token
        id: token
        run: echo "present=${{ env.CLOUDFLARE_API_TOKEN != '' }}" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v4
        if: steps.token.outputs.present == 'true'
        with:
          node-version: 22
      - name: Deploy worker
        if: steps.token.outputs.present == 'true'
        working-directory: worker
        run: |
          npm ci
          npx wrangler deploy
